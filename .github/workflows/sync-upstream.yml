name: Sync upstream with mozilla-central

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/cache@v3
        with:
          path: _cache/upstream
          key: upstream
      - run: |
          ./sync.sh _filtered
          git fetch -f --progress ./_filtered main:upstream
      - name: Push upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push -fu --progress "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" upstream
