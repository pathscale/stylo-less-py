[package]
name = "stylo_property_codegen"
version.workspace = true
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2021"
description = "Generates the property sources that build.py used to emit"

# Intended to be used from style/build.rs, so it stays a library with no heavy
# dependencies and no dependency on the style crate it generates for.
[dependencies]
stylo_property_model = { version = "0.19.0", path = "../stylo_property_model" }
